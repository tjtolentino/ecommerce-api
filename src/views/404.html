<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body style="margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f8fafc; box-sizing: border-box; overflow-x: hidden;">

    <!-- Main Responsive Wrapper Card -->
    <main style="width: 100%; max-width: 580px; margin: 24px; padding: 48px 32px; background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); text-align: center; box-sizing: border-box; position: relative;">

        <div style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.25); border-radius: 9999px; margin-bottom: 24px;">
            <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #818cf8;"></span>
            <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.05em; color: #a5b4fc; text-transform: uppercase;">Error 404</span>
        </div>

        <div style="position: relative; margin-bottom: 12px;">
            <h1 style="margin: 0; font-size: clamp(84px, 18vw, 128px); font-weight: 800; line-height: 1; letter-spacing: -0.04em; background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4)); user-select: none;">
                404
            </h1>
        </div>

        <h2 style="margin: 0 0 12px; font-size: clamp(20px, 4vw, 24px); font-weight: 700; color: #f1f5f9; letter-spacing: -0.02em;">
            Lost in the Digital Void
        </h2>

        <p style="margin: 0 auto; max-width: 440px; font-size: 15px; line-height: 1.6; color: #94a3b8; font-weight: 400;">
            The page you're searching for might have been removed, had its name changed, or is temporarily unavailable. Please check the URL or return to your previous destination.
        </p>

        <div style="margin-top: 36px; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.06); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #64748b;">
            <span>Status: Resource missing</span>
            <span>System OK</span>
        </div>

    </main>

</body>

</html>
